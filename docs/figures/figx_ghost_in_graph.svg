<text x="80" y="1700" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">WIRE REGISTER — source · mechanism · destination (README §00c convention, continued)</text>
<text x="80" y="1738" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">①</text>
<text x="130" y="1738" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">Creative Practice → X</text>
<text x="620" y="1738" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">the practice is modelled as eight systems; none of them carries a reception term</text>
<text x="2280" y="1738" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">solid</text>
<text x="80" y="1772" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">②</text>
<text x="130" y="1772" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">Music &amp; Sonic Projects → X</text>
<text x="620" y="1772" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">the only series in the repo is packaging counts, which are properties of releases</text>
<text x="2280" y="1772" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">dashed</text>
<text x="80" y="1806" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">③</text>
<text x="130" y="1806" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">Goals, Workflows &amp; Open Questions → X</text>
<text x="620" y="1806" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">the terminal stratum has names for behaviour and no instrument that could record one</text>
<text x="2280" y="1806" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">dashed</text>
<text x="80" y="1840" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">④</text>
<text x="130" y="1840" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">Zaziopath Vault → X</text>
<text x="620" y="1840" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">five strata re-describe the unknown in five registers; none measures it</text>
<text x="2280" y="1840" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">dashed</text>
<text x="80" y="1874" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">⑤</text>
<text x="130" y="1874" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">Evidence Audits → X</text>
<text x="620" y="1874" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">the audits derive the anomalies and then classify them as psychology</text>
<text x="2280" y="1874" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">dashed</text>
<text x="80" y="1908" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">⑥</text>
<text x="130" y="1908" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">X → Stewardship Ledger</text>
<text x="620" y="1908" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">every receipt format is defined; what a receipt would be filed about is unassigned</text>
<text x="2280" y="1908" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">dashed</text>
<text x="80" y="1942" font-family="'Courier New', Courier, monospace" font-size="15" fill="#231F20">⑦</text>
<text x="130" y="1942" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#231F20">X → Indexes</text>
<text x="620" y="1942" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E6A66">the Inventory names 336 notes; two resolve here; the absent 334 are of a piece with X</text>
<text x="2280" y="1942" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">dashed</text>
<text x="80" y="2000" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">full reading: the Major Knowledge Graph note · this node added by the X dossier · regenerate: python3 tools/generate_ghost_node.py</text>
<text x="80" y="2030" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E6A66">the node is empty on purpose: naming X would require a measurement the repository does not contain, and inventing one would be the exact error the audits document</text>
